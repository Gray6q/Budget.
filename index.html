<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buget – Acasă</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="header__logo" href="index.html">Buget<span class="header__dot">.</span></a>
      <nav class="nav">
        <a class="nav__link nav__link--active" href="index.html">Acasă</a>
        <a class="nav__link" href="pages/detalii.html">Detalii</a>
        <a class="nav__link" href="pages/tranzactii.html">Tranzacții</a>
        <a class="nav__link" href="pages/detalii.html">Categorii</a>
      </nav>
    </div>
  </header>

  <main class="overview">
    <h1 class="visually-hidden">Prezentare generală</h1>
    <span class="chip" data-js="month"></span>

    <div class="ring">
      <svg class="ring__svg" data-js="ring" viewBox="0 0 300 300" role="img" aria-label="Cheltuit din venituri">
        <circle class="ring__track" cx="150" cy="150" r="120"/>
        <circle class="ring__value" data-js="ring-value" cx="150" cy="150" r="120" stroke-dasharray="0 754"/>
      </svg>
      <div class="ring__center">
        <span class="ring__label">Sold curent</span>
        <span class="ring__amount" data-js="balance"></span>
        <span class="ring__currency">MDL</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat__label">Venituri</div>
        <div class="stat__value stat__value--income" data-js="income"></div>
      </div>
      <div class="stat">
        <div class="stat__label">Cheltuieli</div>
        <div class="stat__value stat__value--expense" data-js="expense"></div>
      </div>
      <div class="stat">
        <div class="stat__label">Cheltuit din venituri</div>
        <div class="stat__value stat__value--accent" data-js="percent"></div>
      </div>
    </div>

    <a class="button overview__cta" href="pages/detalii.html">Vezi toate detaliile →</a>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
